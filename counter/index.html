    <div class="page-heading"><h1>Counter</h1><p class="muted">Use the buttons, arrow keys, or swipe the count area.</p></div>
    <noscript><p class="error">Enable JavaScript to use the tools. Navigation works without it.</p></noscript>
    <p id="storage-status" class="error" role="status" hidden></p>
    
<section class="panel counter-panel" aria-label="Counter controls">
  <div class="actions" style="margin-top:0"><button id="counter-reset" class="danger" type="button">Reset</button><button id="counter-save" class="secondary" type="button">Save</button><button id="counter-undo" class="secondary" type="button" hidden>Undo reset</button></div>
  <div id="counter-pad" class="counter-pad" aria-label="Swipe up or right to add; down or left to subtract"><output id="counter-value" class="counter-value" aria-live="polite" aria-atomic="true">0</output></div>
  <div class="counter-controls"><button id="counter-minus" class="secondary" type="button" aria-label="Decrease counter">−</button><button id="counter-plus" type="button" aria-label="Increase counter">+</button></div>
  <p class="hint" style="margin-top:8px">Up / right: +1 · Down / left: −1<br>Every change is saved automatically on this device.</p>
  <p id="counter-status" class="status" role="status" hidden></p>
</section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
